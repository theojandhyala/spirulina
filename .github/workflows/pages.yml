name: Deploy site to GitHub Pages

# Publishes site/ to GitHub Pages. Pages deployments are only permitted
# from the repository's default branch, so this lists both the eventual
# main and the branch that is currently default.
on:
  push:
    branches:
      - main
      - claude/bluebloom-design-criteria-v1-dgowzx
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must be switched on once, by hand, at
      # Settings > Pages > Build and deployment > Source: GitHub Actions.
      # The workflow token cannot create the Pages site itself
      # ("Resource not accessible by integration"), so enablement is not
      # attempted here. After that one-time toggle this workflow deploys
      # on every push to the default branch.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
